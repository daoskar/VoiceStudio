plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.daoskar.voicestudio'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.daoskar.voicestudio'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.0.12077973'

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    implementation 'com.qualcomm.qti:onnxruntime-android-qnn:2.6.0'
    implementation 'com.qualcomm.qti:qnn-runtime:2.50.0'
}

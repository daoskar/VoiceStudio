name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build signed test APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk VoiceStudio-Android-arm64-${GITHUB_SHA::7}.apk
          sha256sum VoiceStudio-Android-arm64-${GITHUB_SHA::7}.apk > VoiceStudio-Android-arm64-${GITHUB_SHA::7}.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-Android-arm64
          path: |
            VoiceStudio-Android-arm64-*.apk
            VoiceStudio-Android-arm64-*.apk.sha256

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest VoiceStudio-Android-arm64-*.apk VoiceStudio-Android-arm64-*.apk.sha256 --target "${GITHUB_SHA}" --title "VoiceStudio Android latest" --notes "Automated ARM64 Android build from branch android at ${GITHUB_SHA}." --prerelease

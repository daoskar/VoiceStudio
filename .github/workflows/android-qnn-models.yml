name: Build Supertonic QNN models

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - "scripts/prepare_supertonic_qnn.py"
      - ".github/workflows/android-qnn-models.yml"

permissions:
  contents: write

jobs:
  quantize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install quantization tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'onnx==1.17.0' 'onnxruntime==1.27.0' 'huggingface_hub>=0.29,<1' numpy ml_dtypes

      - name: Build QDQ models
        run: |
          python scripts/prepare_supertonic_qnn.py --output supertonic3-qnn

      - name: Validate quantized ONNX files
        run: |
          python - <<'PY'
          from pathlib import Path
          import onnx, onnxruntime as ort
          root=Path('supertonic3-qnn/onnx')
          names=['duration_predictor','text_encoder','vector_estimator','vocoder']
          for name in names:
              p=root/f'{name}.onnx'
              m=onnx.load(p)
              onnx.checker.check_model(m)
              ort.InferenceSession(str(p), providers=['CPUExecutionProvider'])
              print(name, p.stat().st_size)
          PY

      - name: Build SM8850/V81 QNN EPContext (vocoder)
        run: |
          python -m pip install 'onnxruntime-qnn==2.6.0'
          python - <<'PY'
          from pathlib import Path
          import onnxruntime as ort

          src = Path('supertonic3-qnn/onnx/vocoder.onnx')
          out = Path('supertonic3-qnn/onnx/vocoder_sm8850_ctx.onnx')

          so = ort.SessionOptions()
          so.add_session_config_entry('ep.context_enable', '1')
          so.add_session_config_entry('ep.context_embed_mode', '1')
          so.add_session_config_entry('ep.context_file_path', str(out))

          providers = ['QNNExecutionProvider']
          provider_options = [{
              'backend_type': 'htp',
              'soc_model': '87',
              'htp_arch': '81',
          }]

          print('available providers:', ort.get_available_providers())
          sess = ort.InferenceSession(
              str(src),
              sess_options=so,
              providers=providers,
              provider_options=provider_options,
          )
          print('generated:', out, out.exists(), out.stat().st_size if out.exists() else 0)
          PY

      - name: Validate SM8850 EPContext
        run: |
          python - <<'PY'
          from pathlib import Path
          import onnx
          p=Path('supertonic3-qnn/onnx/vocoder_sm8850_ctx.onnx')
          if not p.is_file():
              raise SystemExit('missing vocoder_sm8850_ctx.onnx')
          m=onnx.load(p)
          nodes=[n for n in m.graph.node if n.op_type == 'EPContext']
          if not nodes:
              raise SystemExit('generated model has no EPContext node')
          print('EPContext nodes:', len(nodes), 'size:', p.stat().st_size)
          PY

      - name: Package model bundle
        run: |
          tar -C supertonic3-qnn -czf VoiceStudio-Supertonic3-QNN-QDQ.tar.gz .
          sha256sum VoiceStudio-Supertonic3-QNN-QDQ.tar.gz > VoiceStudio-Supertonic3-QNN-QDQ.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-Supertonic3-QNN-QDQ
          path: |
            VoiceStudio-Supertonic3-QNN-QDQ.tar.gz
            VoiceStudio-Supertonic3-QNN-QDQ.tar.gz.sha256

      - name: Publish model prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-qnn-models-latest --yes --cleanup-tag || true
          gh release create android-qnn-models-latest \
            VoiceStudio-Supertonic3-QNN-QDQ.tar.gz \
            VoiceStudio-Supertonic3-QNN-QDQ.tar.gz.sha256 \
            --target '${{ github.sha }}' \
            --title 'VoiceStudio Android QNN models latest' \
            --notes 'QDQ/INT8 Supertonic-3 models plus SM8850/V81 QNN EPContext vocoder.' \
            --prerelease
